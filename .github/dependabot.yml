version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    # typescript-eslint 8 exige typescript < 6.1.0; se quita cuando lo soporte.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      produccion:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      acciones:
        patterns: ['*']
