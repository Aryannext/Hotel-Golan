name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias del lockfile
        run: npm ci --ignore-scripts
      - name: Revisar código con ESLint
        run: npm run lint
      - name: Revisar tipos de API y web
        run: npm run tipos
      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage
      - name: Compilar la web para producción
        run: npm run web:build
      - name: Guardar reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-${{ github.run_id }}
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  postgres:
    # HG-HAL-001 HAL-35: la misma suite contra PostgreSQL 16 real, con conexiones y bloqueos de verdad (PGlite atiende
    # una transacción a la vez). Cada entorno de prueba crea y borra su propia base.
    name: Pruebas con PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PRUEBAS_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias del lockfile
        run: npm ci --ignore-scripts
      - name: Ejecutar pruebas contra PostgreSQL
        run: npm test
